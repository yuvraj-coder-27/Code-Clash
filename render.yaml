services:
  - type: web
    name: codeclash-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./code_clash.db
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /
